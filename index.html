<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訪視督導回饋語句庫</title>
<style>
  :root{
    --navy:#0f3057;
    --navy-deep:#0a2240;
    --teal:#00a896;
    --teal-dark:#028090;
    --mint:#e8f7f5;
    --mint-border:#bfeaf5;
    --ink:#1c2b3a;
    --muted:#5b6b7a;
    --paper:#ffffff;
    --amber:#f2a541;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    background:linear-gradient(180deg,var(--navy-deep) 0%, var(--navy) 130px, #f4f8f9 130px);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    padding:26px 20px 16px;
    color:#fff;
    max-width:960px;
    margin:0 auto;
  }
  header h1{ margin:0 0 4px; font-size:21px; letter-spacing:1px; }
  header p{ margin:0; font-size:12.5px; color:#bcd4e6; }
  .container{ max-width:960px; margin:0 auto; padding:0 16px; }

  .search-bar{
    margin-top:-20px;
    margin-bottom:14px;
    background:var(--paper);
    border-radius:14px;
    box-shadow:0 6px 20px rgba(15,48,87,0.15);
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .search-bar input{
    flex:1; border:none; outline:none; font-size:15px;
    font-family:inherit; color:var(--ink); padding:6px 4px;
  }
  .search-bar .icon{ color:var(--teal-dark); font-size:16px; }

  /* 已選取清單面板 */
  .selected-panel{
    background:var(--navy);
    border-radius:14px;
    padding:14px 16px 16px;
    margin-bottom:18px;
    box-shadow:0 6px 20px rgba(15,48,87,0.2);
  }
  .selected-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .selected-header h2{
    color:#fff;
    font-size:14px;
    margin:0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .selected-header .count-badge{
    background:var(--teal);
    color:#fff;
    font-size:11px;
    padding:1px 8px;
    border-radius:999px;
  }
  .selected-actions{ display:flex; gap:6px; }
  .btn-small{
    font-size:12px;
    padding:6px 12px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-copy-all{ background:var(--teal); color:#fff; font-weight:bold; }
  .btn-copy-all:hover{ background:var(--teal-dark); }
  .btn-clear{ background:rgba(255,255,255,0.12); color:#fff; }
  .btn-clear:hover{ background:rgba(255,255,255,0.22); }

  .selected-empty{
    color:#9fb8cc;
    font-size:13px;
    text-align:center;
    padding:14px 6px;
  }
  .charcount-bar{
    font-size:12px;
    color:#bcd4e6;
    text-align:right;
    margin:-2px 2px 8px;
  }
  .charcount-bar.over{
    color:#fff;
    background:#e0553f;
    display:inline-block;
    padding:4px 10px;
    border-radius:8px;
    font-weight:bold;
    float:right;
  }
  .charcount-warning{
    clear:both;
    background:#fdeceb;
    color:#c0392b;
    border:1px solid #f1b3ac;
    border-radius:8px;
    padding:8px 10px;
    font-size:12.5px;
    margin:6px 0 10px;
    display:none;
  }
  .charcount-warning.show{ display:block; }
  .selected-list{ display:flex; flex-direction:column; gap:10px; }
  .selected-item{
    background:#fff;
    border-radius:10px;
    padding:10px 10px 8px;
  }
  .selected-item-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .selected-item-left{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .selected-num{
    flex-shrink:0;
    width:22px;
    height:22px;
    background:var(--teal);
    color:#fff;
    border-radius:50%;
    font-size:12px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .selected-back{
    flex-shrink:0;
    background:var(--navy);
    border:1px solid var(--navy);
    color:#fff;
    font-size:12px;
    font-weight:bold;
    border-radius:8px;
    padding:6px 10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .selected-back:hover{ background:var(--navy-deep); }
  .selected-item-body{
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .selected-textarea{
    flex:1;
    border:1px solid #dfeaea;
    border-radius:8px;
    padding:7px 9px;
    font-family:inherit;
    font-size:13.5px;
    line-height:1.6;
    resize:none;
    overflow:hidden;
    color:var(--ink);
  }
  .selected-textarea:focus{ outline:2px solid var(--teal); border-color:transparent; }
  .selected-remove{
    flex-shrink:0;
    background:none;
    border:1px solid var(--mint-border);
    color:var(--teal-dark);
    font-size:11px;
    border-radius:8px;
    padding:6px 8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .selected-remove:hover{ background:var(--mint); }

  .tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .tab{
    border:1px solid var(--mint-border);
    background:var(--paper);
    color:var(--navy);
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab:hover{ background:var(--mint); }
  .tab.active{ background:var(--teal); border-color:var(--teal); color:#fff; font-weight:bold; }

  .category{ margin-bottom:24px; }
  .category-title{
    font-size:15px; font-weight:bold; color:var(--navy);
    margin-bottom:10px; border-left:4px solid var(--teal); padding-left:10px;
  }
  .category-count{ font-size:12px; color:var(--muted); font-weight:normal; }

  .card{
    background:var(--paper);
    border:1px solid #e3edf0;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
    transition:all .15s ease;
  }
  .card:hover{ border-color:var(--teal); box-shadow:0 4px 14px rgba(0,168,150,0.1); }
  .card.selected{ background:var(--mint); border-color:var(--teal); }

  .card-summary{
    font-size:12.5px;
    font-weight:bold;
    color:var(--teal-dark);
    margin-bottom:4px;
    letter-spacing:0.3px;
    user-select:none;
  }
  .card-summary::before{ content:"摘要｜"; color:var(--amber); font-weight:bold; }
  .card-text{
    font-size:14px;
    line-height:1.7;
    white-space:pre-line;
    margin-bottom:8px;
  }
  .card-footer{ display:flex; justify-content:flex-end; gap:8px; }
  .top-btn{
    font-size:12px;
    padding:6px 12px;
    border-radius:8px;
    border:1px solid var(--navy);
    background:var(--navy);
    color:#fff;
    cursor:pointer;
    font-family:inherit;
  }
  .top-btn:hover{ background:var(--navy-deep); }
  .add-btn{
    font-size:12px;
    padding:6px 12px;
    border-radius:8px;
    border:1px solid var(--teal);
    background:var(--mint);
    color:var(--teal-dark);
    cursor:pointer;
    font-family:inherit;
  }
  .add-btn.on{ background:var(--teal); color:#fff; }
  .add-btn:hover{ filter:brightness(0.97); }

  .empty-state{ text-align:center; color:var(--muted); padding:40px 10px; font-size:14px; }

  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy-deep); color:#fff;
    padding:10px 20px; border-radius:999px; font-size:13px;
    opacity:0; pointer-events:none; transition:all .25s ease;
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>訪視督導回饋語句庫</h1>
</header>

<div class="container">
  <div class="search-bar">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜尋關鍵字（例如：睡眠、回報、環評…）">
  </div>

  <div class="selected-panel">
    <div class="selected-header">
      <h2>📋 已選取語句 <span class="count-badge" id="countBadge">0</span></h2>
      <div class="selected-actions">
        <button class="btn-small btn-clear" id="clearBtn">清空</button>
        <button class="btn-small btn-copy-all" id="copyAllBtn">複製全部</button>
      </div>
    </div>
    <div class="charcount-bar" id="charCountBar">總字數：0／190</div>
    <div class="charcount-warning" id="charCountWarning">⚠️ 已超過190字上限，請調整內容（移除或縮減部分語句）</div>
    <div id="selectedList"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="results"></div>
</div>

<div class="toast" id="toast">已複製</div>

<script>
const DATA = [
  { cat: "睡眠", items: [
    { s: "嬰兒床床板應隨年齡調降", t: "請留意托育人員對於托兒的睡眠區域的安排，並請提醒托育人員隨著幼兒年齡增長，嬰兒床的床板也應漸漸放低，避免托兒攀爬、翻落。" },
    { s: "收托較小嬰幼兒時嬰兒床應清空", t: "請留意托育人員對於幼兒睡眠區域的安排，並提醒托育人員若之後收托年齡較小的嬰幼兒時，如有睡嬰兒床應把嬰兒床清空，避免棉被衣物擺放、設置床圍。" },
    { s: "嬰兒床不綁床圍（窒息風險）", t: "請提醒托育人員嬰兒床不建議綁床圍，擔心會有窒息、繩子勒住、悶熱等風險，且無法直接安全看視。" },
    { s: "睡眠應平坦堅硬，不建議搖椅", t: "請加強提醒托育人員留意幼兒睡眠環境安全，幼兒睡眠應睡在平坦堅硬且安全的睡眠空間；並建議不適合使用安撫搖椅。" },
    { s: "落實睡眠安全看視，調整睡眠區域", t: "請加強宣導幼兒睡眠安全，並提醒應落實幼兒睡眠安全看視，建議托育人員再調整幼兒的睡眠區域。" },
    { s: "搖床固定，仍須隨年齡調整", t: "請加強提醒托育人員留意幼兒睡眠安全，雖然托育人員已將搖床固定住無法搖晃，但適用月齡有限，請提醒托育人員隨著托兒年齡增長調整幼兒睡眠區域。" },
    { s: "同睡幼兒棉被避免遮蔽口鼻", t: "請留意托育人員對於幼兒睡眠區域的安排，若幼兒們同睡在一起，請務必提醒托育人員留意避免幼兒們的棉被有互相遮蔽口鼻的風險。" },
    { s: "沙發不適合作為睡眠使用", t: "請向托育人員說明並宣導沙發不適合做為睡眠使用，因沙發構造不夠平坦堅硬且有窒息、摔落等風險，故請加強提醒托育人員留意幼兒睡眠環境安全，幼兒睡眠應睡在平坦堅硬且安全的睡眠空間。" },
    { s: "一歲以下應採仰睡，禁趴睡", t: "一歲以下幼兒應採仰睡，趴睡恐致危險，請輔導改善。" },
    { s: "落實五招安心睡", t: "請輔導落實五招安心睡，以維護幼兒睡眠安全。" },
    { s: "趴睡應協助翻正為仰睡", t: "提醒幼兒不使用趴睡的睡姿，若幼兒因熟睡後呈現趴姿時，仍請以幼兒的安全性為主，協助幼兒翻正為仰睡的睡姿。" },
    { s: "不建議用安撫椅，睡眠空間應淨空", t: "請提醒托育人員，幼兒睡眠區域不建議使用安撫椅，應提供平坦、堅硬且安全的睡眠設備，並保持睡眠空間淨空，避免放置枕頭、棉被、抱枕、毛巾等物品，以降低窒息與跌落風險。" },
    { s: "安撫椅改善情形應持續追蹤", t: "對於幼兒的睡眠區域不建議使用安撫椅作為工具，應提供合宜適當且安全的區域作為幼兒睡眠區，後續的訪視仍須追蹤了解是否有改善。" },
    { s: "睡眠期間應可隨時看視", t: "睡眠看視：請提醒托育人員，幼兒睡眠期間應維持可隨時看視之狀態，避免幼兒處於無人留意之情形，以確保睡眠安全。" },
    { s: "睡眠位置應利於即時看視", t: "睡眠位置調整：若幼兒主要於客廳區域活動，建議將睡眠區域調整至托育人員可即時看視之位置，以利隨時留意幼兒睡眠狀況。" },
    { s: "不同空間睡眠仍應適時巡視", t: "不同空間睡眠：若幼兒於不同空間睡眠，請提醒托育人員仍應維持適時巡視或可看視之狀態，以確保幼兒安全。" },
    { s: "睡眠環境應平坦穩固", t: "睡眠環境安全：請提醒托育人員，幼兒睡眠環境應保持平坦、穩固，並避免放置枕頭、棉被、抱枕等鬆軟物品，以降低窒息風險。" },
    { s: "落實仰睡原則並留意呼吸", t: "睡眠姿勢：請提醒托育人員落實仰睡原則，並持續留意幼兒睡眠姿勢及呼吸狀況，以確保睡眠安全。" },
    { s: "確認睡眠設備安全性", t: "睡眠設備使用：若使用嬰兒床或睡眠設備，請提醒托育人員確認設備安全性，並留意幼兒活動能力，以避免翻身或跌落之風險。" },
    { s: "避免長時間無人看視", t: "睡眠期間看視頻率：請提醒托育人員於幼兒睡眠期間適時留意幼兒狀況，確保幼兒未處於長時間無人看視之情形。" },
    { s: "年齡較小幼兒應加強睡眠看視", t: "年齡較小幼兒：對於年齡較小之幼兒，請提醒托育人員更需加強睡眠期間之留意與看視，以確保照顧安全。" },
    { s: "全日托應了解夜間睡眠查看情形", t: "針對該托育人員收托全日托幼兒，請於下次了解托育人員平時是否有足夠的時間休息，以及晚間幼兒入睡時，是否有進行幼兒的睡眠狀況查看等。" }
  ]},
  { cat: "托育日誌／發展", items: [
    { s: "托育日誌增加睡眠／如廁／活動紀錄", t: "請輔導托育人員落實紀錄托育日誌，並建議托育人員除了記錄幼兒飲食外，可增加紀錄幼兒睡眠/如廁/活動等狀況。" },
    { s: "落實紀錄托育日誌，避免LINE聊天式傳送", t: "請加強宣導托育人員落實紀錄托育日誌，並鼓勵托育人員使用紙本/APP/LINE【記事本】，請建議托育人員避免用LINE訊息一則一則聊天式傳送，避免一來一回，耽誤托育工作。" },
    { s: "鼓勵使用記事本，避免LINE聊天式傳送", t: "請鼓勵托育人員使用紙本/APP/LINE【記事本】，避免用LINE訊息聊天式傳送，一來一回，耽誤托育工作。" },
    { s: "早產兒發展檢核以矯正年齡計算", t: "請提醒托育人員若幼兒為早產兒，幼兒2歲前施作發展檢核時應以預產期作為矯正年齡施作檢核。" },
    { s: "活動空間需符合年齡與發展", t: "請持續留意托兒的活動空間是否符合環境安全，並評估該活動空間是否符合托兒的年齡與發展。" },
    { s: "W腿坐姿留意大肢體發展", t: "此次環評照片中有拍到（幼兒姓名）W腿坐姿，請提醒托育人員留意幼兒坐姿，避免影響大肢體動作發展。" },
    { s: "LINE托育日誌應定期備份", t: "運用LINE做為托育日誌，請提醒托育人員應適時備份保存，以免因手機故障或其他原因導致無法取得托育日誌。" },
    { s: "發展檢核未通過應早療通報追蹤", t: "（幼兒姓名）經發展檢核後未通過，請繼續早療通報，並請持續追蹤其發展。" },
    { s: "發展檢核結果應提供家長並回傳中心", t: "請提醒托育人員務必落實幼兒每階段的發展檢核篩檢，並將檢核結果提供家長查閱後，回傳中心備存。" },
    { s: "新收托觀察：活動空間區隔與大肢體練習", t: "針對新收托幼兒之收托觀察，可了解托育人員對於較大年紀與較小年紀幼兒的活動空間是否有所區隔，並於收托時觀察托育人員是否適時提供幼兒大肢體動作的練習（如：趴姿、翻身等）。" },
    { s: "LINE托育日誌內容應完整記錄作息用藥", t: "該托育人員為使用LINE與家長進行溝通，仍須提醒托育人員，若使用LINE紀錄幼兒托育日誌，紀錄內容也須包含幼兒作息、飲食、排便、活動等狀況；另幼兒若有用藥需求，除須請家長填寫用藥委託單並確認為醫囑用藥外，也需詳細記錄幼兒用藥時間、劑量。" },
    { s: "外用藥膏應記錄擦拭次數", t: "請提醒托育人員，幼兒若有用藥需求，除確認為醫囑用藥外，托育日誌也須詳細記錄用藥時間、劑量；如為外用藥膏，應明確記錄擦拭次數，以便家長接回後能依循日誌紀錄進行照護。" }
  ]},
  { cat: "環評", items: [
    { s: "維持環境安全並追蹤改善項目", t: "請提醒托育人員須時時維持環境安全，並追蹤托育人員是否有維持此次訪視現場改善之項目。" },
    { s: "追蹤環境檢核複查情形", t: "請追蹤托育地環境檢核複查情形，並提醒托育人員托育地環境安全檢核應時時維持符合。" },
    { s: "40項符合仍須維持環境安全", t: "請加強宣導雖然環境檢核40項皆符合，但環境安全仍須符合才能算通過。" },
    { s: "醫藥箱生理食鹽水效期", t: "下半年訪視請留意托育地醫藥箱裡的生理食鹽水是否有在效期內。" },
    { s: "吊掛物擺放位置及高度", t: "請向托育人員宣導吊掛物包含背巾、袋子、包包等，皆應留意擺放位置及高度，以免造成幼兒傷害事件。" },
    { s: "環境安全不侷限於環評40項", t: "請提醒托育人員托育地環境安全檢核不侷限於環評40項，且環境安全應時時維持符合。" },
    { s: "多項現場改善，應時時維持", t: "多項環評為現場改善，請提醒托育人員應時時維持托育地環境安全。" },
    { s: "落實托育地清潔衛生維持", t: "請輔導托育人員落實托育地清潔衛生之維持。" },
    { s: "廚房屬危險區域，幼兒不應進入", t: "廚房為危險區域，幼兒不應進入廚房，請輔導改善。" },
    { s: "環境改善項目多，下次務必複查", t: "因此次環境改善項目較多，請於下次訪視時務必再確認環境安全是否維持。並請提醒托育人員托育地環境安全檢核不侷限於環評40項，且環境安全皆應時時維持符合。" },
    { s: "說明環境安全檢查的意義與價值", t: "請傳達理解托育地也是托育人員日常生活居處，了解托育人員及其同住成員有日常起居的使用習慣，說明環境安全檢查是有助於托育專業的提升，維持托兒的安全環境，養成良好的安全行為，營造舒適的托育服務空間，不但能獲得家長的信賴，更能避免事故傷害發生的機率。" },
    { s: "未使用設施應收納整齊", t: "針對環境上如有未使用的設施設備，請提醒托育人員務必收納整齊，以提供安全的托育空間給幼兒活動。" },
    { s: "追蹤環境未符合項目改善", t: "確認環境未符合的項目是否完成改善。" },
    { s: "物品擺設規劃避免托育空間危險", t: "托育環境的空間仍須留意物品的擺設與規劃，避免因擺放過多物品或非相關托育使用物品，致使托育空間存在危險性，因此提醒托育人員托育空間的安全性需多加留意。" },
    { s: "追蹤限期改善日期內是否完成", t: "請落實追蹤該托育人員環境檢核未符合之項目，是否已於限期改善日期內完成改善。" },
    { s: "教玩具破損應改善避免受傷", t: "針對托育環境提供之教玩具有破損狀況，請務必提醒托育人員進行改善，避免因教玩具破損而導致幼兒受傷（誤食、割傷等）。" },
    { s: "隨時維持環境40項標準", t: "請後續訪視時確認該員是否隨時維持托育環境40項標準，以確保托育空間之安全與品質。" },
    { s: "未經環評空間恐影響保險理賠", t: "請提醒托育人員，應避免於未經環境評估之空間提供托育服務，倘於該類空間發生幼兒受傷情形，恐影響托育人員專業責任保險之理賠權益；若欲新增使用空間，可先行規劃並連繫中心，於訪員完成環境評估後，方能進行使用，以保障幼兒安全及自身權益。" },
    { s: "不建議幼兒佩戴手套（纏繞風險）", t: "訪視照片見幼兒配戴手套，請致電提醒托育人員，不建議讓幼兒佩戴手套，避免手套內之棉線具纏繞幼兒手指之風險。" }
  ]},
  { cat: "收托規範", items: [
    { s: "收托人數計算規範（三親等內幼兒）", t: "請宣導收托人數規範，並說明若無監護人陪同照顧，在托育地5歲以下三親等內幼兒及12歲以下幼兒皆須計算在收托人數內。" },
    { s: "留意收托人數是否符合規範", t: "請留意托育人員的收托人數是否符合規範。" }
  ]},
  { cat: "到宅", items: [
    { s: "新領證在職／體檢／回報事項總整理", t: "請留意托育人員新領證後的在職、體檢安排，並加強宣導收托回報、意外事故24小時內回報、傳染病知悉48小時內回報、定期施作發展檢核、紀錄寶寶日誌、睡眠安全、用藥安全、外出目的應以幼兒利益為主等相關托育事項。" },
    { s: "停止申請送審與恢復申請提醒", t: "請協助托育人員完成停止申請之送審作業，並宣導停止申請後如有進行托育相關工作，應重新辦理恢復申請。" },
    { s: "追蹤在職時數與線上課程進度", t: "請持續留意托育人員在職時數，並追蹤其線上課程完成進度、時數證明回傳狀況。" },
    { s: "收托前先確認型態是否符合規範", t: "因到宅收托不是只看托育地的人數，也會以當日的托育型態合併計算，故可以提醒托育人員若往後有新收托案件，可於收托前先回報中心確認型態是否符合規範。" },
    { s: "到宅仍須留意環境安全並溝通", t: "請提醒托育人員雖到宅托育地為家長家，但托育人員仍須留意環境安全並適時給予家長建議和溝通討論。" },
    { s: "托育人員仍為主要照顧者", t: "請提醒托育人員托育期間即便家長在家、或家中有其他偕同照顧者，但托育人員仍為托兒的主要照顧者。" },
    { s: "續約請同步通知托育區", t: "請追蹤托育人員的收托狀況，如完成續約請同步通知托育區。" },
    { s: "收托異動七日內回報主區、托育區", t: "請持續追蹤托育人員的收托狀況，並請提醒托育人員如有收托異動應於事實發生七日內同步回報主區、托育區。" },
    { s: "收托前完成簽約並七日內回報", t: "請提醒托育人員收托前應完成簽約並於事實發生七日內回報中心。" },
    { s: "收托人數／型態變更應7日內回報", t: "請提醒托育人員，收托人數調整異動或托育型態變更皆須回報中心知悉，並掌握托育人員是否已落實7日內回報。" },
    { s: "追蹤托育人員後續托育動向", t: "請持續追蹤該托育人員後續的托育動向及意願。" },
    { s: "追蹤是否仍從事托育工作", t: "持續追蹤托育人員是否有從事托育的工作。" },
    { s: "未托育仍須每年兩次不約訪", t: "托育人員雖未托育服務，但仍須一年進行兩次不約訪之訪視。" },
    { s: "快篩陰性後始能參加基本救命術課程", t: "落實確認托育人員有完成快篩陰性才能參予基本救命術的實體課程，並請訪員協助安排課程。" },
    { s: "安排實地審查確認搬遷完成", t: "請近日安排實地審查，確認該托育人員已完成搬遷事宜。" },
    { s: "確認責任保險地址異動", t: "請確認托育人員是否進行責任保險地址異動。" },
    { s: "搬遷後應修正契約地址並簽名備存", t: "請提醒托育人員，若確認搬遷完成，務必修正托育契約書托育地址一欄，並與家長雙方簽名確認後，繳交影本乙份至中心備存。" },
    { s: "追蹤停托申請進度並計算時數", t: "請後續追蹤托育人員辦理停止托育之申請進度，若（保母姓名）已繳件，請協助進行後續流程辦理並計算在職研習課程須完成之時數。" },
    { s: "恢復托育服務應辦理登記並補足時數", t: "請提醒托育人員，若後續欲進行在宅托育之服務，請務必先行提出恢復登記服務之辦理，待中心完成實地審查後將送件至主管機關，待領取登記證書後，方能進行在宅托育之服務，另須補足年度未完成之在職研習課程時數。" },
    { s: "停托應告知注意事項與時數規定", t: "請於該員至中心辦理停止托育服務時，提供停止托育服務注意事項，以利托育人員知悉停止托育期間不得進行托育服務，以及後續欲辦理恢復時，須依比例補足研習時數之相關規定。" },
    { s: "追蹤換證申請進度", t: "請持續追蹤該托育人員居家托育服務登記證書屆期換證申請進度，若該員逾期尚未繳交資料，請再另行通知。" }
  ]},
  { cat: "宣導、輔導", items: [
    { s: "加強宣導緊急事件處理流程", t: "請加強宣導緊急事件處理流程，並提醒托育人員應提供適當且安全的睡眠設備與空間。" },
    { s: "追蹤2年1次體檢與回傳", t: "請追蹤托育人員是否於期限內完成2年1次體檢，並確認托育人員的體檢報告是否有回傳中心。" },
    { s: "外出散步需家長同意並注意安全", t: "請提醒托育人員帶幼兒外出散步活動時應經過家長允許並注意外出安全。" },
    { s: "紀錄寶寶日誌、睡眠安全、異動回報", t: "請輔導托育人員紀錄寶寶日誌、留意幼兒睡眠安全，以及如有收托異動應於事實發生7日內回報中心。" },
    { s: "收托異動期限、準公收費上限", t: "請持續宣導托育人員留意收托異動的期限及相關回報資料，另提醒托育人員目前仍為準公身分，應持續遵守準公收費上限。" },
    { s: "收托狀況與回報，異動七日內回報", t: "請追蹤托育人員的收托狀況與收托回報，並加強輔導托育人員如有新收托/終托/收托異動等皆須於事實發生7日內回報中心。" },
    { s: "意外／傳染病回報時效與日常事項", t: "請宣導意外事故24小時內回報、傳染病知悉48小時內回報、定期施作發展檢核、紀錄寶寶日誌、睡眠安全、用藥安全、外出目的應以幼兒利益為主。" },
    { s: "外出活動注意環境與看視", t: "請提醒托育人員帶孩子外出活動，一定要注意環境安全、幼兒安全及安全看視。" },
    { s: "2歲以下不建議戴口罩", t: "2歲以下嬰幼兒因呼吸道較小且無法自行取下口罩，有導致窒息的風險，所以不建議戴口罩，屬於「不適合戴口罩」對象，而且也沒有適合的口罩尺寸。" },
    { s: "學步車無助學步且易翻覆", t: "請提醒托育人員學步車（又稱螃蟹車）其實無助『學步』，用來暫時安放幼兒也不適合，並說明可能會影響幼兒走路的姿勢、且容易翻覆導致更多風險。" },
    { s: "勿睡沙發床／躺椅／娃娃車", t: "請加強宣導幼兒睡眠安全，並提醒托育人員請勿讓托兒睡在沙發床、安撫躺椅和娃娃車上，避免托兒有跌落受傷的危險。且「娃娃車」是適用於幼兒外出的使用工具，也不能用來睡眠時放置。" },
    { s: "同住家人不可代為照顧行為", t: "請再留意托兒與托育人員同住家人的互動情形，並請提醒托育人員主要照顧者仍為托育人員，其同住家人不可代為從事照顧行為（如餵食、洗澡等）。" },
    { s: "托育時間專心，家務安排確認", t: "請加強宣導托育時間務必專心托育，並請確認平時全日托期間托育人員如何安排倒垃圾、買菜的家務。" },
    { s: "幼兒受傷應24小時內回報", t: "請提醒托育人員幼兒不論是在托育地受傷、還是帶傷到托育地，皆應落實紀錄並於24小時內回報中心。" },
    { s: "恢復托育服務應辦理申請程序", t: "請務必清楚告知：依據居家式托育服務提供者登記及管理辦法第15條，托育人員恢復托育服務時，應填具申請書，並檢附有關文件，經原核發服務登記證書機關同意後，始可收托。故未領有登記證期間不得從事托育工作。" },
    { s: "托育時間應避免長時間滑手機", t: "托育時間要專心托育，請輔導托育人員勿長時間使用手機。" },
    { s: "落實幼兒洗澡前準備工作", t: "請輔導托育人員落實幼兒洗澡前的準備工作。" },
    { s: "訪視時可準備教玩具轉移幼兒注意力", t: "建議與托育人員進行訪視的過程中，托育人員可準備教玩具讓幼兒使用，避免訪談期間幼兒因無其他活動而以吸引注意的方式引起關注等。" },
    { s: "逾期未體檢應七日內函文通報", t: "若屆時托育人員未完成兩年一次體檢，請務必於體檢日到期後七日內函文通報主管機關，並持續追蹤該員體檢完成之進度。" },
    { s: "泡奶搖晃易脹氣，應輔導正確調奶方式", t: "針對該員未符合「照顧品質評估指標檢核表」相關項目，訪員已於當下進行輔導，請後續追蹤托育人員是否已改善及調整，並輔導以搖晃方式泡奶因氣泡產生易造成幼兒脹氣等觀念。" },
    { s: "3C產品觀看時間應加強視力保健宣導", t: "針對托育人員提供3C產品、電視供幼兒觀看之狀況，請訪員於下次不同時間訪視時，了解托育人員是否會於其他時間讓幼兒觀看，並加強宣導幼兒視力保健之衛教。" },
    { s: "應提供餵食椅，避免長期使用螃蟹車", t: "請後續訪視時，觀察托育人員是否提供適宜之用餐工具（餵食椅），並提醒托育人員，長期使用螃蟹車易影響幼兒肢體發展。" },
    { s: "避免兩位幼兒同時洗澡", t: "請後續訪視時了解，托育人員針對幼兒洗澡流程是否已進行調整，並加強宣導浴廁環境濕滑易跌滑倒之危險性，切勿讓兩位幼兒同時進行洗澡流程，以避免發生危險。" },
    { s: "調奶方式錯誤應確認改善", t: "照顧品質評估指標檢核勾選「是」項目中調奶方式錯誤部分，訪員已於訪視時進行輔導及示範正確調奶方式，請後續訪視時確認托育人員是否已改善。" },
    { s: "精神飲食異常應評估送醫", t: "請托育人員持續留意幼兒收托時之精神、飲食狀況，若有嘔吐、嗜睡或異常之情形，請評估是否撥打緊急電話（119）送醫。" },
    { s: "尊重家長理念但仍應評估安全風險", t: "請後續加強輔導托育人員，雖托育服務需尊重家長之照顧需求與教養理念，但仍應適度評估其照顧方式是否可能涉及安全風險，並主動提供專業之育兒知能與建議（例如：趴睡可能帶來之窒息風險等），以確保幼兒健康與發展之最佳利益。" },
    { s: "正向教養手冊：以同理傾聽取代責備", t: "建議提供托育人員「0-6歲正向教養手冊」，請輔導托育人員落實正向教養理念，透過同理、尊重與穩定的引導方式，幫助幼兒建立安全感與自我價值；當幼兒出現情緒或行為問題時，建議以觀察與傾聽取代責備，協助幼兒表達情緒並學習自我調節。" },
    { s: "安撫技巧應依幼兒個別反應調整", t: "請下次訪視時留意托育人員是否已調整安撫幼兒的方式，並提供進一步引導，如：幼兒出現情緒時先了解原因，再依發展階段採用適切方式安撫（擁抱、轉移注意力等），安撫技巧應因應個別幼兒反應與需求適時調整。" }
  ]},
  { cat: "親媒", items: [
    { s: "追蹤收托回報與補助送件", t: "請追蹤托育人員的收托回報、家長申請補助送件情形。" },
    { s: "向保親宣導準公收費項目", t: "請向保親同步宣導準公收費項目與上限。" },
    { s: "新收托訪視留意適應與關係", t: "請安排新收托訪視並留意幼兒適應狀況與保親關係。" },
    { s: "電訪家長告知訪視狀況並視需求協助媒合", t: "電訪收托幼兒的家長告知訪視的狀況，另可先了解後續的托育狀況，倘若有媒合轉介的需求，再請訪員協助媒合。" },
    { s: "新收托家長電訪了解適應與保親配合", t: "請進行新收托家長電訪，了解新收托幼兒的適應狀況和保親配合的狀況等。" },
    { s: "擇日訪視了解新收托適應與發展", t: "請訪員安排擇日訪視，以了解新收托幼兒之適應情形及發展狀況。" },
    { s: "多元管道自行媒合並追蹤情形", t: "可建議托育人員除由中心協助媒合外，亦可透過社群平台、親友介紹或托育媒合平台等多元管道自行媒合；另請持續追蹤媒合情形，並確認是否已有新收托幼兒，以利掌握收托現況。" },
    { s: "下半年度年度家長電訪", t: "請於下半年度進行年度家長電訪，了解保親合作及溝通狀況。" },
    { s: "新收托家長滿意度調查", t: "請進行新收托家長滿意度調查，了解新收托幼兒的適應狀況和保親配合的狀況等。" }
  ]},
  { cat: "給同仁的建議", items: [
    { s: "電聯時間斟酌，避免影響作息", t: "建議同仁可以斟酌安排電聯托育人員的時間，若托兒午睡期間撥打電話托育人員未接聽，建議可以改用訊息留言請托育人員回電的方式，避免持續撥打造成影響托育地作息。" },
    { s: "訪視為不約訪說明", t: "說明訪視為不約訪，只要是托育時段中心皆有可能安排訪視。" },
    { s: "用案例柔性輔導增加安全意識", t: "請柔性輔導並用案例與托育人員分享，以增加危機安全意識。" },
    { s: "托兒哭泣應回應安撫", t: "請輔導托育人員若托兒哭的時候，應回應托兒需求、給予安撫。" },
    { s: "演練勿用現托兒姓名舉例", t: "請再加強提醒緊急事件處理流程。另，演練時建議以舉例的方式，如：A童，應盡量避免以現托兒姓名為例，以免造成不必要的誤會。" },
    { s: "電訪確認戶籍及補助提醒", t: "電訪家長時，可分別再確認戶籍，並提醒家長未來如有遷戶籍至臺北市可再申請提升補助。" }
  ]},
  { cat: "重要提醒", items: [
    { s: "115年起在職時數改歷年制", t: "因115年起托育人員在職時數改為歷年制，請務必再留意托育人員的時數安排。" }
  ]},
  { cat: "退件範例", items: [
    { s: "鐵捲門非主要出入口勾選範例", t: "托育地有鐵捲門，但非為主要出入口，故第4項改為「是」、第5項為「無此項目」" },
    { s: "窗簾拉繩誤勾選退件案例", t: "（日期）退件原因：第14項 窗簾拉繩長度及收線器位置為收托兒無法碰觸的高度。>>托育地客廳的窗簾有拉繩，訪員誤勾選為無此項目" },
    { s: "睡床附件誤勾選退件案例", t: "（日期）退件原因：第37項 收托兒睡床之附屬配件或自行加裝之附件穩固。>>托兒睡眠皆在軟墊上，並無睡床。訪員誤勾選為是" },
    { s: "環評不通過項目應盡快改善", t: "（日期）退件原因：依（日期）社會局聯繫會議紀錄，若訪視環評有不通過部分項目應請托育人員盡快改善。" },
    { s: "資服網解除收托資料補充範例", t: "（日期）退件原因：因資服網已解除收托，故補充幼兒資料\n【托兒（幼兒姓名），身份證字號：（身分證字號），出生年月日：（日期），於（日期）新收托，至（日期）結束收托，因資服網已解除收托，故導致收托幼兒與紀錄不符。】" },
    { s: "終托但補助未解除導致不符", t: "【托兒（幼兒姓名）已於（日期）終托，因社會局補助異動尚未解除，故資服網無法解除收托，導致收托幼兒與紀錄不符。】" },
    { s: "送退件日期記錄範例一", t: "（日期）送件，（日期）退件，補充報告內容。" },
    { s: "送退件日期記錄範例二", t: "（日期）送件，（日期）退件（審核說明誤植），（日期）重新送件。" }
  ]},
  { cat: "腸病毒", items: [
    { s: "追蹤復托與清消作業", t: "請追蹤復托情形及宣導加強清消作業。" },
    { s: "病毒群聚應落實感染管控消毒", t: "托育地有病毒群聚現象，請輔導托育人員務必落實感染管控、消毒等工作。" },
    { s: "確診傳染病應通報並告知其他家長", t: "請加強輔導托育人員，於幼兒確診傳染性疾病時應依規定落實通報，並主動告知收托幼兒之家長托育地相關確診情形，以利家長即時觀察幼兒健康狀況。" }
  ]},
  { cat: "受傷", items: [
    { s: "環境安全防護（防撞措施）", t: "環境安全防護必須到位：托育場所內的各項設施（如攀爬架、桌角、硬質傢俱等），應全面加裝防撞泡棉、軟墊或防護設備，切勿讓幼童在無防護措施的環境下遊玩。" },
    { s: "安全帶使用需留意情緒反應", t: "注意輔具與安全設備的正確使用：使用兒童餐椅、安全座椅或安全帶時，應注意幼童情緒與身體反應。若幼童因哭鬧扭動掙扎，應即時檢視安全帶是否會因摩擦或壓迫而造成身體傷害，不可僅放任其自行冷靜。" },
    { s: "每日傷勢檢查與主動溝通", t: "落實每日傷勢檢查與主動溝通：接送幼童時應確實進行身心狀況檢查；若發現幼童身上有任何輕微撞傷、紅腫或異常，應第一時間主動與家長核對、了解、交接傷勢照顧等相關資訊，並詳實記載於托育日誌或對話紀錄中，以釐清責任及後續妥善照顧傷勢。" },
    { s: "保證人地位與過失責任", t: "建立防護觀念，避免不作為責任：保母依法對受託幼童負有「保證人地位」。縱使傷勢可能係幼童自行碰撞或與同儕推擠所致，若係因保母「疏於看管、防護不週（消極不作為）」所造成，法律上仍會被認定構成過失傷害犯罪並負擔刑事責任。" },
    { s: "托育地受傷應進行突發通報", t: "該員（日期）因幼兒於托育地受傷，進行突發或緊急通報處理作業之通報，案件編號為：（案件編號）。" },
    { s: "一年內通報案件應加強訪視", t: "中心接獲主管機關指示，針對一年內之突發或緊急通報案件（兒童保護事件含疑似、事故傷害事件）於四月底前進行加強訪視。" },
    { s: "傷勢不明應進行資訊系統與關懷E起來通報", t: "幼兒傷勢不明之狀況，雖已於當下向家長確認，但因雙方皆無法說出受傷時間及原因，故請訪員進行資訊系統突發或緊急事件通報及關懷E起來通報。" },
    { s: "應進行突發或緊急通報", t: "此案請進行「突發或緊急通報處理作業」通報。" },
    { s: "追蹤幼兒傷勢恢復情形", t: "請持續追蹤該幼兒傷勢恢復情形。" },
    { s: "幼兒於家中受傷已進行通報", t: "此案為幼兒於家中受傷，中心已進行「突發或緊急通報處理作業」之通報。" },
    { s: "電訪關心受傷並宣導居家安全", t: "請電訪家長關心幼兒受傷之情形，並進行居家安全意識之宣導，另請家長留意幼兒於家中之精神、飲食狀況，若有異常請務必帶幼兒就診檢查。" },
    { s: "傷口特殊照護需求應告知托育人員", t: "請致電家長關心幼兒受傷之情形，並進行居家安全之宣導，另請家長留意若有傷口特殊照護之需求，請務必主動告知托育人員。" }
  ]},
  { cat: "超收", items: [
    { s: "超收違規將影響意外理賠", t: "請提醒托育人員，意外事件發生時，托育人員收托人數如違反法規規範（如超收、未通報等相關違規等），所有托兒之意外事件均不能理賠。" }
  ]},
  { cat: "聯合收托", items: [
    { s: "聯合收托應共同在場，否則涉超收", t: "請輔導托育人員，聯合收托之型態如兩位托育人員皆有實際收托幼兒，則應共同留置於托育地進行照顧；倘若其中一人擅自離開托育地，將涉及「未專心托育服務」之疑慮，若因此致使另名托育人員之收托人數超出法定上限，中心將依「超收」情節進行認定與處理。" },
    { s: "聯合托育簽約者應落實主要照顧義務", t: "請於下次訪視時提醒托育人員，聯合托育之型態，簽約者應落實幼兒主要照顧者之義務。" },
    { s: "照顧行為應以契約書簽訂幼兒為主", t: "請於下次訪視時提醒托育人員，聯合收托雖可彼此分工提供托育服務，基於專業責任險理賠方面，托育人員照顧行為（餵奶、洗澡、換尿布等）應以契約書簽訂之幼兒為主。" }
  ]},
  { cat: "健康關懷", items: [
    { s: "關心確診後恢復與收托情形", t: "關心托育人員確診後的恢復狀況，以及追蹤該員恢復收托之情形。" },
    { s: "電訪關心幼兒恢復送托狀況", t: "請電訪家長關心幼兒身體狀況，以及後續追蹤該幼兒恢復送托之狀況。" },
    { s: "持續關心托育人員身體狀況", t: "請持續關心托育人員身體狀況。" },
    { s: "身體不適應請假或利用空檔就醫", t: "請於訪視時提醒托育人員，務必評估及了解自身身體狀況，如有自覺身體不適之情形，應主動向家長請假或運用未托育時段就醫檢查，以維護托育服務品質。" },
    { s: "身體不適建議及早就醫", t: "請提醒托育人員留意自身身體狀況，若有身體不適之情形，建議及早就醫檢查，以利掌握自身健康情形，並維持良好之托育照顧品質。" }
  ]},
  { cat: "行政與通報", items: [
    { s: "函送公文通報並追蹤進度", t: "函送公文通報社會局，後續將密切追蹤公文進度。" },
    { s: "責任保險兩年效期應提醒展延", t: "托育人員專業責任保險效期為兩年，若案件即將超過兩年，應提醒向保險公司提出展延。" },
    { s: "追蹤家防中心確認結果並回報中心", t: "追蹤社會局家防中心與家長確認結果後，另向中心告知，確保後續處理狀況。" },
    { s: "加強訪視安排：初期每月一次共三個月", t: "開始收托後的加強訪視安排：初期為每月一次訪視，為期三個月的密集訪視，後續則列為二級托育人員。加強訪視重點可朝下列面向觀察：了解嬰兒哭鬧時的處理方式、如何建立幼兒常規、若幼兒有違規狀況時的處置方式。" },
    { s: "追蹤優化獎助金送件申請", t: "請持續追蹤確認托育人員是否完成送件申請優化獎助金。" },
    { s: "追蹤特定日期前是否有收托", t: "持續追蹤至（日期）確認托育人員是否有收托，倘若有收托事實再針對已送審的資料呈報社會局知悉。" },
    { s: "追蹤保險投保進度並留存保單", t: "請追蹤托育人員保險投保進度，並於投保完成後將保單影本提供中心備查，以確保已確實完成投保作業。" },
    { s: "確認文件備齊並審核獎助金", t: "請確認繳交文件是否備齊，並進行獎助金之審核作業。" },
    { s: "年度資料應歸檔備存", t: "請將托育人員繳交之年度資料歸檔至托育人員資料檔案中備存。" },
    { s: "追蹤未投保責任保險名單", t: "請定期追蹤該小組組員尚未投保（日期）責任保險之名單，並後續連繫提醒投保相關事宜。" },
    { s: "轉知收托身心障礙幼兒實施計畫", t: "訪員轉知【（日期）收托身心障礙暨疑似發展遲緩幼兒實施計畫】申請訊息，托育人員表示無申請意願，登打電訪紀錄備查。" }
  ]},
  { cat: "如廁訓練", items: [
    { s: "家長托育應一致引導如廁練習", t: "請建議托育人員與家長共同討論幼兒於家中及托育地之如廁情形，採一致性之引導方式進行如廁練習，並以鼓勵及正向支持為原則，避免責備或強迫幼兒，以利建立幼兒良好之如廁習慣。" },
    { s: "依發展狀況觀察如廁訊號", t: "請建議托育人員依幼兒發展狀況及需求，觀察幼兒如廁訊號，適時引導幼兒如廁，並與家長保持溝通，共同掌握幼兒如廁練習情形，以利協助幼兒逐步建立自主如廁能力。" },
    { s: "1歲半至2歲如廁練習規劃", t: "請建議托育人員持續觀察幼兒發展情形及如廁準備度，並與家長討論幼兒如廁練習規劃，循序漸進引導幼兒認識如廁流程，以利日後建立良好如廁習慣（適用1歲半至2歲階段）。" }
  ]},
  { cat: "紀錄格式範例", items: [
    { s: "終止托育家長電訪紀錄範本", t: "此篇記錄為終止托育家長電訪，了解過往配合之情形，因幼兒已異動，故於托育人員之例行訪視紀錄中登打。" },
    { s: "終止托育滿意度調查紀錄範本", t: "此篇報告為終止托育之家長電訪滿意度調查，因幼兒已異動，無法新增家長電訪，故登打於托育人員輔導紀錄中備存。" },
    { s: "臨托終止電訪紀錄範本", t: "此篇記錄為幼兒終止托育家長電訪，了解臨托配合之情形及後續臨托之需求，因幼兒已異動，故於托育人員之例行訪視紀錄中登打。" },
    { s: "發放年度相見歡手冊紀錄範本", t: "此紀錄為訪視員至托育地發放年度相見歡手冊，並完成訪視紀錄登錄備存。" },
    { s: "準公契約簽訂內容確認電訪範本", t: "此為準公契約書簽訂內容確認電訪，與托育人員確認理解簽訂之準公契約內容以及收費上限規定。" }
  ]},
  { cat: "通用結尾語", items: [
    { s: "持續追蹤關心幼兒發展狀況", t: "請持續追蹤關心幼兒發展狀況。" },
    { s: "請依下次輔導重點執行", t: "請依下次輔導重點執行。" }
  ]}
];

// 給每一筆項目一個唯一 id
let uid = 0;
DATA.forEach(g => g.items.forEach(it => { it.id = 'i' + (uid++); }));
const ALL_ITEMS = {};

const CHAR_LIMIT = 190;

// 標點符號轉全形（阿拉伯數字 0-9 維持半形，不受影響）
const PUNCT_MAP = {
  ',': '，', '.': '。', ':': '：', ';': '；',
  '!': '！', '?': '？', '(': '（', ')': '）',
  '[': '［', ']': '］', '{': '｛', '}': '｝',
  "'": '＇', '"': '＂', '~': '～', '/': '／',
  '\\': '＼', '-': '－', '_': '＿', '%': '％',
  '@': '＠', '#': '＃', '&': '＆', '*': '＊',
  '+': '＋', '=': '＝', '<': '＜', '>': '＞'
};
function toFullWidthPunct(str){
  return str.replace(/[,.:;!?()\[\]{}'"~/\\\-_%@#&*+=<>]/g, ch => PUNCT_MAP[ch] || ch);
}
DATA.forEach(g => g.items.forEach(it => { ALL_ITEMS[it.id] = it; }));

let selectedOrder = [];   // 存 id，依選取順序
let editedText = {};      // id -> 使用者編輯後的文字

const tabsEl = document.getElementById('tabs');
const resultsEl = document.getElementById('results');
const searchInput = document.getElementById('searchInput');
const toast = document.getElementById('toast');
const selectedListEl = document.getElementById('selectedList');
const countBadge = document.getElementById('countBadge');
const charCountBar = document.getElementById('charCountBar');
const charCountWarning = document.getElementById('charCountWarning');

let activeCat = "全部";

function buildTabs(){
  const cats = ["全部", ...DATA.map(d => d.cat)];
  tabsEl.innerHTML = "";
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (c === activeCat ? ' active' : '');
    btn.textContent = c;
    btn.onclick = () => { activeCat = c; renderResults(); };
    tabsEl.appendChild(btn);
  });
}

function toggleSelect(id){
  const idx = selectedOrder.indexOf(id);
  if (idx === -1){
    selectedOrder.push(id);
  } else {
    selectedOrder.splice(idx, 1);
  }
  renderResults();
  renderSelected();
}

function showToast(msg){
  toast.textContent = msg || '已複製';
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
}

function renderResults(){
  buildTabs();
  const keyword = searchInput.value.trim();
  resultsEl.innerHTML = "";
  let anyMatch = false;

  DATA.forEach(group => {
    if (activeCat !== "全部" && activeCat !== group.cat) return;
    const filtered = group.items.filter(it => !keyword || it.t.includes(keyword) || it.s.includes(keyword));
    if (filtered.length === 0) return;
    anyMatch = true;

    const catDiv = document.createElement('div');
    catDiv.className = 'category';

    const title = document.createElement('div');
    title.className = 'category-title';
    title.innerHTML = `${group.cat} <span class="category-count">（${filtered.length}）</span>`;
    catDiv.appendChild(title);

    filtered.forEach(it => {
      const isSelected = selectedOrder.includes(it.id);
      const card = document.createElement('div');
      card.className = 'card' + (isSelected ? ' selected' : '');

      const summary = document.createElement('div');
      summary.className = 'card-summary';
      summary.textContent = it.s;

      const textEl = document.createElement('div');
      textEl.className = 'card-text';
      textEl.textContent = it.t;

      const footer = document.createElement('div');
      footer.className = 'card-footer';

      const btn = document.createElement('button');
      btn.className = 'add-btn' + (isSelected ? ' on' : '');
      btn.textContent = isSelected ? '✓ 已加入（點擊移除）' : '＋ 加入清單';
      btn.onclick = () => toggleSelect(it.id);

      const topBtn = document.createElement('button');
      topBtn.className = 'top-btn';
      topBtn.textContent = '⬆ 回到主選項';
      topBtn.onclick = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      footer.appendChild(topBtn);
      footer.appendChild(btn);
      card.appendChild(summary);
      card.appendChild(textEl);
      card.appendChild(footer);
      catDiv.appendChild(card);
    });

    resultsEl.appendChild(catDiv);
  });

  if (!anyMatch){
    resultsEl.innerHTML = '<div class="empty-state">找不到符合的語句，換個關鍵字試試看</div>';
  }
}

function autoResize(ta){
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight) + 'px';
}

function renderSelected(){
  countBadge.textContent = selectedOrder.length;
  selectedListEl.innerHTML = "";

  // 計算總字數（以目前顯示/編輯後的文字為準）並更新字數列
  let totalChars = 0;
  selectedOrder.forEach(id => {
    const it = ALL_ITEMS[id];
    const currentText = editedText[id] !== undefined ? editedText[id] : toFullWidthPunct(it.t);
    totalChars += currentText.length;
  });
  charCountBar.textContent = `總字數：${totalChars}／${CHAR_LIMIT}`;
  if (totalChars > CHAR_LIMIT){
    charCountBar.classList.add('over');
    charCountWarning.classList.add('show');
  } else {
    charCountBar.classList.remove('over');
    charCountWarning.classList.remove('show');
  }

  if (selectedOrder.length === 0){
    selectedListEl.innerHTML = '<div class="selected-empty">尚未選取語句，點選下方「＋ 加入清單」開始建立回饋內容</div>';
    return;
  }

  const list = document.createElement('div');
  list.className = 'selected-list';

  selectedOrder.forEach((id, index) => {
    const it = ALL_ITEMS[id];
    const currentText = editedText[id] !== undefined ? editedText[id] : toFullWidthPunct(it.t);

    const row = document.createElement('div');
    row.className = 'selected-item';

    const top = document.createElement('div');
    top.className = 'selected-item-top';

    const left = document.createElement('div');
    left.className = 'selected-item-left';

    const backBtn = document.createElement('button');
    backBtn.className = 'selected-back';
    backBtn.textContent = '↑ 回到主選項';
    backBtn.onclick = () => {
      tabsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    const num = document.createElement('div');
    num.className = 'selected-num';
    num.textContent = index + 1;

    left.appendChild(backBtn);
    left.appendChild(num);
    top.appendChild(left);

    const body = document.createElement('div');
    body.className = 'selected-item-body';

    const ta = document.createElement('textarea');
    ta.className = 'selected-textarea';
    ta.value = currentText;
    ta.rows = 1;
    ta.oninput = () => { editedText[id] = ta.value; autoResize(ta); };

    const removeBtn = document.createElement('button');
    removeBtn.className = 'selected-remove';
    removeBtn.textContent = '移除本則';
    removeBtn.onclick = () => toggleSelect(id);

    body.appendChild(ta);
    body.appendChild(removeBtn);

    row.appendChild(top);
    row.appendChild(body);
    list.appendChild(row);
  });

  selectedListEl.appendChild(list);
  // 初始化高度
  list.querySelectorAll('textarea').forEach(autoResize);
}

function copyAll(){
  if (selectedOrder.length === 0){
    showToast('尚未選取任何語句');
    return;
  }
  let totalChars = 0;
  const text = selectedOrder.map((id, i) => {
    const it = ALL_ITEMS[id];
    const raw = editedText[id] !== undefined ? editedText[id] : toFullWidthPunct(it.t);
    const t = raw.replace(/\s*\n+\s*/g, ' ').trim();
    totalChars += t.length;
    return `${i + 1}. ${t}`;
  }).join('\n');

  const doCopySuccess = () => {
    if (totalChars > CHAR_LIMIT){
      showToast(`已複製，但總字數 ${totalChars} 已超過 ${CHAR_LIMIT} 字，請調整`);
    } else {
      showToast('已複製全部（' + selectedOrder.length + ' 則）');
    }
  };

  navigator.clipboard.writeText(text).then(doCopySuccess).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    doCopySuccess();
  });
}

document.getElementById('copyAllBtn').onclick = copyAll;
document.getElementById('clearBtn').onclick = () => {
  selectedOrder = [];
  editedText = {};
  renderResults();
  renderSelected();
};

searchInput.addEventListener('input', renderResults);

renderResults();
renderSelected();
</script>

</body>
</html>
